# Checks only: lint, typecheck, tests, the PostgreSQL integration tests, build
# and a secret scan. No secrets, no deploys.
name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: docker
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install
        run: |
          npm install --global pnpm@10.15.0
          pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    runs-on: docker
    timeout-minutes: 30
    services:
      postgres:
        # Same pinned image as tests/fixtures/postgres.ts.
        image: postgres:17@sha256:aa90e97ee862e558111d34cfb8b2c4bec768c2b039fb791341686928560263b3
        env:
          POSTGRES_PASSWORD: ci-throwaway
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REQUIRE_DATABASE_TESTS: 'true'
      SOCIAL_TEST_POSTGRES_URL: postgres://postgres:ci-throwaway@postgres:5432/postgres
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install
        run: |
          npm install --global pnpm@10.15.0
          pnpm install --frozen-lockfile

      # The suites create the same database and roles, so they run one at a time.
      - name: Integration tests
        run: pnpm test:db --no-file-parallelism

  secret-scan:
    runs-on: docker
    timeout-minutes: 10
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Scan the tree with gitleaks
        run: |
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          tmp=$(mktemp -d)
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL -o "$tmp/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${sha256}  $tmp/$archive" | sha256sum -c -
          mkdir "$tmp/gitleaks"
          tar -xzf "$tmp/$archive" -C "$tmp/gitleaks" gitleaks
          "$tmp/gitleaks/gitleaks" dir . --redact --no-banner --exit-code 1
